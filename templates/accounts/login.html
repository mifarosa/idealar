{% extends "base.html" %}
{% block title %}Giriş · Idealar{% endblock %}
{% block content %}
<h1>Giriş yap</h1>
<form method="post" class="card stack">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <label>Kullanıcı adı
    {{ form.username }}
  </label>
  <label>Şifre
    {{ form.password }}
  </label>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="button" type="submit">Giriş</button>
</form>
{% endblock %}
