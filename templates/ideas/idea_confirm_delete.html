{% extends "base.html" %}
{% block title %}Fikri sil · Idealar{% endblock %}
{% block content %}
<div class="page-head"><h1>Fikri sil</h1></div>
<form method="post" class="form panel">
  {% csrf_token %}
  <p>“{{ object.display_title }}” ve özellikleri kalıcı olarak silinecek.</p>
  <div class="actions">
    <button class="btn danger" type="submit">Evet, sil</button>
    <a class="btn quiet" href="{% url 'ideas:detail' object.pk %}">Vazgeç</a>
  </div>
</form>
{% endblock %}
