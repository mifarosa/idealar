{% extends "base.html" %}
{% block title %}{% if object %}Projeyi düzenle{% else %}Yeni proje{% endif %} · Idealar{% endblock %}
{% block content %}
<h1>{% if object %}Projeyi düzenle{% else %}Yeni proje{% endif %}</h1>
<form method="post" class="card stack">
  {% csrf_token %}
  {% include "ideas/_form_fields.html" %}
  <div class="row">
    <button class="button" type="submit">Kaydet</button>
    <a class="button button-secondary" href="{% url 'ideas:project-list' %}">Vazgeç</a>
  </div>
</form>
{% endblock %}
