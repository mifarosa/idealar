{% extends "base.html" %}
{% block title %}Projeyi sil · Idealar{% endblock %}
{% block content %}
<div class="page-head"><h1>Projeyi sil</h1></div>
<form method="post" class="form panel">
  {% csrf_token %}
  <p>“{{ object.name }}” silinecek. Bağlı fikirler silinmez, yalnızca bağlantı kalkar.</p>
  <div class="actions">
    <button class="btn danger" type="submit">Evet, sil</button>
    <a class="btn quiet" href="{% url 'ideas:project-detail' object.pk %}">Vazgeç</a>
  </div>
</form>
{% endblock %}
