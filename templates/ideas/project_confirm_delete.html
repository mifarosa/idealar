{% extends "base.html" %}
{% block title %}Projeyi sil · Idealar{% endblock %}
{% block content %}
<h1>Projeyi sil</h1>
<form method="post" class="card stack">
  {% csrf_token %}
  <p>“{{ object.name }}” silinecek. Bağlı fikirler silinmez, yalnızca bağlantı kalkar.</p>
  <div class="row">
    <button class="button button-danger" type="submit">Evet, sil</button>
    <a class="button button-secondary" href="{% url 'ideas:project-detail' object.pk %}">Vazgeç</a>
  </div>
</form>
{% endblock %}
