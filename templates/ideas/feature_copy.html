{% extends "base.html" %}
{% block title %}Özelliği kopyala · Idealar{% endblock %}
{% block content %}
<div class="page-head"><h1>Özelliği kopyala</h1></div>
<form method="post" class="form panel">
  {% csrf_token %}
  <p>“{{ feature.text }}” seçtiğin fikirlere yeni, işaretsiz bir madde olarak eklenir.</p>
  {% include "ideas/_form_fields.html" %}
  <div class="actions">
    <button class="btn primary" type="submit">Kopyala</button>
    <a class="btn quiet" href="{% url 'ideas:detail' feature.idea_id %}">Vazgeç</a>
  </div>
</form>
{% endblock %}
